name: 🦸 Continuous Deployment

on:
  push:
    branches:
      - main
  # Builds and tests the devcontainer before a change to it merges. Nothing is
  # released or published from a pull request; the skip step below and the
  # image push filters both hold to that.
  pull_request:
    paths:
      - .devcontainer/**
      - .env.default
      - .github/workflows/continuous-deployment.yml
      - infrastructure/docker/docker-compose.yml
      - package.json
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write
  # The identity token pnpm signs each package's npm provenance attestation
  # with; without it, `pnpm publish --provenance` refuses to publish.
  id-token: write

# Never cancel a deployment/release run. Concurrency is scoped per-ref so
# releases on main queue sequentially without colliding. A pull request's run
# only builds the devcontainer, so a newer push to it replaces the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  continuous-deployment:
    name: ${{ matrix.target.emoji }} ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.target.timeout }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - id: build-devcontainer
            name: Devcontainer
            emoji: 🧑‍🏭
            timeout: 20
          # v2.31.0 took 7m19s: 4 minutes to set up, build, trace, graph, and
          # measure, and 3 for semantic-release, most of it the version
          # commit's pre-commit hook. A cold Nx cache adds about 4 to the
          # first part. `nx release version` makes a second version commit
          # whose hook checks every bumped ic-suite package and its
          # dependents (25 projects on the first release), none of them
          # cached because each bump changes a manifest, so this leaves room
          # for that hook and the npm publish. Re-size it from the first real
          # release run. A timeout before the push leaves nothing behind; a
          # later one is finished by the next run, whose publish skips
          # versions already on npm.
          - id: push-releases
            name: Releases
            emoji: 🦸
            timeout: 24

    steps:
      # Decides from the GitHub API alone, before any checkout, so a run with
      # nothing to do finishes in seconds. The devcontainer is built when the
      # change touches a file the image or its test reads: its own
      # configuration, the compose and environment files that configuration
      # loads, this workflow, or the `packageManager` pin in `package.json`
      # that the test checks pnpm against. Any other `package.json` edit, such
      # as a release's version bump, does not rebuild it. When the change set
      # cannot be read in full, it builds rather than guess.
      - name: 🚦 Skip Conditionally
        id: check-skip
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TARGET_ID: ${{ matrix.target.id }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$TARGET_ID" = "build-devcontainer" ] && [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            if [ "$EVENT_NAME" = "pull_request" ]; then
              BASE="$PULL_REQUEST_BASE"
              HEAD="$PULL_REQUEST_HEAD"
            else
              BASE="$PUSH_BEFORE"
              HEAD="$SHA"
            fi

            if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then
              echo "🧑‍🏭 No previous revision to compare against; building the devcontainer."
            else
              COMPARISON="$(gh api "repos/$REPOSITORY/compare/${BASE}...${HEAD}")"
              FILE_COUNT="$(jq '.files | length' <<< "$COMPARISON")"
              MATCH_PATTERN='^(\.devcontainer/|\.env\.default$|\.github/workflows/continuous-deployment\.yml$|infrastructure/docker/docker-compose\.yml$)'
              PACKAGE_MANAGER_PATTERN='^[-+][[:space:]]*"packageManager"'

              if [ "$FILE_COUNT" -ge 300 ]; then
                echo "🧑‍🏭 ${FILE_COUNT} changed files may be truncated; building the devcontainer."
              elif jq -r '.files[].filename' <<< "$COMPARISON" | grep -qE "$MATCH_PATTERN"; then
                echo "🧑‍🏭 Devcontainer files changed; building the devcontainer."
              elif jq -r '.files[] | select(.filename == "package.json") | .patch // ""' \
                <<< "$COMPARISON" | grep -qE "$PACKAGE_MANAGER_PATTERN"; then
                echo "🧑‍🏭 The packageManager pin changed; building the devcontainer."
              else
                echo "⏭️ No devcontainer changes detected; skipping devcontainer build."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi

          if [ "$TARGET_ID" = "push-releases" ]; then
            if [ "$EVENT_NAME" = "pull_request" ]; then
              echo "⏭️ Pull requests never release"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            tip="$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)"
            if [ "$tip" != "$SHA" ]; then
              echo "⏭️ $SHA superseded by $tip, whose run releases instead"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            else
              echo "🦸 $SHA holds main's tip, releasing"
            fi
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: 📥 Checkout Repository
        if: steps.check-skip.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Devcontainer Build & Publish Steps
      - name: 🗂️ Setup Environment File
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'build-devcontainer'
        run: |
          cp .env.default .env
          echo "LOCAL_WORKSPACE_FOLDER=$GITHUB_WORKSPACE" >> .env

      - name: 🔧 Set up Docker Buildx
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'build-devcontainer'
        uses: docker/setup-buildx-action@v4

      - name: 🔐 Login to GitHub Container Registry
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'build-devcontainer'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build Devcontainer Image
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'build-devcontainer'
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/cloud/devcontainer.json
          imageName: ghcr.io/organizzolini/codebase-devcontainer
          cacheFrom: |
            ghcr.io/organizzolini/codebase-devcontainer:latest
          push: filter
          refFilterForPush: |
            refs/heads/main
          eventFilterForPush: |
            push
            workflow_dispatch
          env: |
            CI=true
            GH_TOKEN=${{ secrets.GITHUB_TOKEN }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}

      - name: 🔬 Test Devcontainer Image
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'build-devcontainer'
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/cloud/devcontainer.json
          imageName: ghcr.io/organizzolini/codebase-devcontainer
          cacheFrom: |
            ghcr.io/organizzolini/codebase-devcontainer:latest
          push: never
          env: |
            CI=true
            GH_TOKEN=${{ secrets.GITHUB_TOKEN }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          runCmd: |
            bash .devcontainer/scripts/test-devcontainer.sh

      # Release Steps
      - name: 🕋 Setup Codebase for Release
        id: setup
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'push-releases'
        uses: ./.github/actions/setup-codebase
        with:
          nx-shas: "false"

      - name: 🔐 Import GPG Key
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'push-releases'
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: 🔎 Check Commit Signing Configuration
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'push-releases'
        run: bash scripts/git/check-commit-signing-configuration.sh

      - name: 👷 Build Projects
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'push-releases'
        run: pnpm exec nx run-many --target=build

      - name: 🔭 Trace Calls
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'push-releases'
        run: pnpm exec nx run codebase:callidescope:write

      - name: 🕸️ Graph Dependencies
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'push-releases'
        run: pnpm exec nx run codebase:codependix:write

      - name: 👔 Inventory Generators
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'push-releases'
        run: |
          pnpm exec nx run-many \
            --target=conformetry-generators \
            --configuration=write

      - name: 🔗 Synchronize
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'push-releases'
        run: |
          pnpm exec nx run-many \
            --target=conventional-config \
            --target=devcontainer-configuration \
            --target=pull-request-template \
            --target=skill-exclusions \
            --configuration=write

      - name: 📊 Measure Code
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'push-releases'
        run: |
          pnpm exec nx run-many --target=codometer --configuration=write \
            --exclude=codebase
          pnpm exec nx run codebase:codometer:write

      # Versions the ic-suite packages, writes each one's changelog, commits,
      # tags and pushes, and leaves the remote carrying the release token for
      # semantic-release's push below. `scripts/release/version-packages.sh`
      # explains the push it makes.
      - name: 🏷️ Version Packages
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'push-releases'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GIT_COMMITTER_EMAIL: jimmypaolini@gmail.com
          GIT_COMMITTER_NAME: Jimmy Paolini
        run: bash scripts/release/version-packages.sh

      # Publishes each released package to npm with provenance, and to GitHub
      # Packages under the owner's scope.
      # `scripts/release/publish-packages.sh` explains why it uses pnpm, why the
      # GitHub Packages copies are renamed, and how a re-run completes a run that
      # stopped part way. The workflow's own token publishes the copies, which
      # links each one to this repository; `packages: write` above allows it.
      - name: 📦 Publish Packages
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'push-releases'
        env:
          GITHUB_PACKAGES_TOKEN: ${{ github.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bash scripts/release/publish-packages.sh

      # semantic-release versions, tags and releases the codebase itself, the
      # `v*` release the README badge shows, never an ic-suite package.
      - name: 🦸 Release Codebase
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'push-releases'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GIT_COMMITTER_EMAIL: jimmypaolini@gmail.com
          GIT_COMMITTER_NAME: Jimmy Paolini
        run: pnpm semantic-release

      # The only save of this workflow's Nx cache, which the next release
      # restores. Every project is built above, so it covers the whole graph.
      - name: 🧹 Cleanup Codebase
        if: >-
          always() &&
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'push-releases'
        uses: ./.github/actions/cleanup-codebase
        with:
          nx-cache-primary-key: ${{ steps.setup.outputs.nx-cache-primary-key }}
