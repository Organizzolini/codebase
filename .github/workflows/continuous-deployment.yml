name: 🦸 Continuous Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      verbose:
        description: Enable verbose Nx logging
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

# Never cancel a deployment/release run. Concurrency is scoped per-ref so
# releases on main queue sequentially without colliding.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  continuous-deployment:
    name: ${{ matrix.target.emoji }} ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.target.timeout }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - id: build-projects
            name: Projects
            emoji: 👷
            timeout: 12
          - id: build-devcontainer
            name: Devcontainer
            emoji: 🧑‍🏭
            timeout: 20
          # About 8–9 minutes of build, trace, graph, and measure precede
          # semantic-release, and its version commit's pre-commit hook takes
          # about 3–4 more, led by `codebase:codependix:check`.
          - id: push-releases
            name: Releases
            emoji: 🦸
            timeout: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🚦 Skip Conditionally
        id: check-skip
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          TARGET_ID="${{ matrix.target.id }}"
          EVENT_NAME="${{ github.event_name }}"

          if [ "$TARGET_ID" = "build-devcontainer" ] && [ "$EVENT_NAME" = "push" ]; then
            BEFORE_SHA="${{ github.event.before }}"
            ZERO_SHA="0000000000000000000000000000000000000000"
            if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$ZERO_SHA" ]; then
              CHANGED_FILES=$(git diff --name-only "$BEFORE_SHA" \
                "${{ github.sha }}" || true)
            else
              CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD || true)
            fi

            MATCH_PATTERN='^(\.devcontainer/|\.github/workflows/continuous-deployment\.yml)'
            if ! echo "$CHANGED_FILES" | grep -qE "$MATCH_PATTERN"; then
              echo "⏭️ No devcontainer changes detected; skipping devcontainer build."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [ "$TARGET_ID" = "push-releases" ]; then
            tip="$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)"
            if [ "$tip" != "$SHA" ]; then
              echo "⏭️ $SHA superseded by $tip, whose run releases instead"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            else
              echo "🦸 $SHA holds main's tip, releasing"
            fi
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      # Projects Build Steps
      - name: 🕋 Setup Codebase
        id: setup
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'build-projects'
        uses: ./.github/actions/setup-codebase
        with:
          python-dependencies: "false"

      - name: 👷 Build Projects
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'build-projects'
        env:
          NX_VERBOSE_LOGGING: ${{ inputs.verbose || false }}
        uses: ./.github/actions/run-affected
        with:
          target: build-projects

      - name: 🧹 Cleanup Codebase
        if: >-
          always() &&
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'build-projects'
        uses: ./.github/actions/cleanup-codebase
        with:
          nx-cache-primary-key: ${{ steps.setup.outputs.nx-cache-primary-key }}

      # Devcontainer Build & Publish Steps
      - name: 🗂️ Setup Environment File
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'build-devcontainer'
        run: |
          cp .env.default .env
          echo "LOCAL_WORKSPACE_FOLDER=$GITHUB_WORKSPACE" >> .env

      - name: 🔧 Set up Docker Buildx
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'build-devcontainer'
        uses: docker/setup-buildx-action@v4

      - name: 🔐 Login to GitHub Container Registry
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'build-devcontainer'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build Devcontainer Image
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'build-devcontainer'
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/cloud/devcontainer.json
          imageName: ghcr.io/organizzolini/codebase-devcontainer
          cacheFrom: |
            ghcr.io/organizzolini/codebase-devcontainer:latest
          push: filter
          refFilterForPush: |
            refs/heads/main
          eventFilterForPush: |
            push
            workflow_dispatch
          env: |
            CI=true
            GH_TOKEN=${{ secrets.GITHUB_TOKEN }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}

      - name: 🔬 Test Devcontainer Image
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'build-devcontainer'
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/cloud/devcontainer.json
          imageName: ghcr.io/organizzolini/codebase-devcontainer
          cacheFrom: |
            ghcr.io/organizzolini/codebase-devcontainer:latest
          push: never
          env: |
            CI=true
            GH_TOKEN=${{ secrets.GITHUB_TOKEN }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          runCmd: |
            bash .devcontainer/scripts/test-devcontainer.sh

      # Release Steps
      - name: 🕋 Setup Codebase for Release
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'push-releases'
        uses: ./.github/actions/setup-codebase
        with:
          nx-shas: "false"

      - name: 🔐 Import GPG Key
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'push-releases'
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: 🔎 Check Commit Signing Configuration
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'push-releases'
        run: bash scripts/git/check-commit-signing-configuration.sh

      - name: 👷 Build Projects
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'push-releases'
        run: pnpm exec nx run-many --target=build

      - name: 🔭 Trace Calls
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'push-releases'
        run: pnpm exec nx run codebase:callidescope:write

      - name: 🕸️ Graph Dependencies
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'push-releases'
        run: pnpm exec nx run codebase:codependix:write

      - name: 👔 Inventory Generators
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'push-releases'
        run: |
          pnpm exec nx run-many \
            --target=conformetry-generators \
            --configuration=write

      - name: 🔗 Synchronize
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'push-releases'
        run: |
          pnpm exec nx run-many \
            --target=conventional-config \
            --target=devcontainer-configuration \
            --target=pull-request-template \
            --target=skill-exclusions \
            --configuration=write

      - name: 📊 Measure Code
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'push-releases'
        run: |
          pnpm exec nx run-many --target=codometer --configuration=write \
            --exclude=codebase
          pnpm exec nx run codebase:codometer:write

      - name: 🦸 Push Releases
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.target.id == 'push-releases'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GIT_COMMITTER_EMAIL: jimmypaolini@gmail.com
          GIT_COMMITTER_NAME: Jimmy Paolini
        run: pnpm semantic-release
