name: 🧑‍🚒 Upgrade Dependencies

on:
  schedule:
    - cron: 18 8 * * 5
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade-dependencies:
    name: 🧑‍🚒 Upgrade Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 🕋 Setup Codebase
        uses: ./.github/actions/setup-codebase
        with:
          nx-shas: "false"

      - name: 🎁 Upgrade pnpm
        run: |
          jq --arg v "pnpm@$(pnpm view pnpm version)" \
            '.packageManager = $v' package.json > package.json.temporary
          mv package.json.temporary package.json

      - name: 🟢 Upgrade node
        run: |
          jq --arg v ">=${LATEST_NODE}" '.engines.node = $v' \
            package.json > package.json.temporary
          mv package.json.temporary package.json

      - name: 🐍 Upgrade Python
        run: |
          uv python install 3 --upgrade
          LATEST_PYTHON=$(uv run --python 3 python -c "
          import sys
          v=sys.version_info
          print(f'{v.major}.{v.minor}')
          ")
          PYTHON_VER=$(echo "$LATEST_PYTHON" | tr -d '.')

          from="requires-python = \">=3\.[0-9][0-9]*"
          to="requires-python = \">=${LATEST_PYTHON}"
          sed -i "s/${from}/${to}/" pyproject.toml

          from="target-version = \"py[0-9][0-9]*"
          to="target-version = \"py${PYTHON_VER}"
          sed -i "s/${from}/${to}/" pyproject.toml

          from="pythonVersion = \"3\.[0-9][0-9]*"
          to="pythonVersion = \"${LATEST_PYTHON}"
          sed -i "s/${from}/${to}/" pyproject.toml

          from="requires-python = \">=3\.[0-9][0-9]*"
          to="requires-python = \">=${LATEST_PYTHON}"
          sed -i "s/${from}/${to}/" projects/affirmancy/pyproject.toml

      # Per-package npm and GitHub Actions version bumps now come from
      # Dependabot (.github/dependabot.yml) as their own isolated pull
      # requests, not from a bulk `pnpm update --latest --recursive` here —
      # see that file for why, and for where the typescript and
      # eslint-plugin-unicorn holds now live. This step only dedupes: it
      # reaches transitive dependencies that individual Dependabot bumps
      # cannot, since a transitive package satisfying its parents' ranges
      # stays pinned even as its parents move — how a vulnerable copy
      # survives a run of successful upgrades.
      - name: 📦 Deduplicate Lockfile
        run: pnpm dedupe

      # The cheapest thing that proves the dedupe did not break Nx itself.
      # Loading the project graph loads every workspace plugin — failing here
      # names the dedupe as the cause while the diff is still on disk, rather
      # than five steps later inside the husky pre-commit hook of `🔀 Open
      # Pull Request`, reported as `Unexpected error: pre-commit`.
      #
      # No `--configuration=check` lint gate here: the commit below fires
      # pre-commit, which runs the whole gate already. This only has to catch
      # a toolchain that cannot start.
      - name: 🩺 Verify Toolchain
        run: pnpm exec nx show projects

      - name: 📦 Upgrade Python Dependencies
        # One lockfile covers every uv workspace member.
        run: uv lock --upgrade

      - name: 🤹 Upgrade Skills
        run: |
          pnpm exec skills update --yes
          # The skills CLI has a bug when no agents are detected and --yes is passed:
          # it falls back to installing for ALL agents. For the 'eve' agent, it
          # hardcodes canonicalBase to agent/skills, creating an untracked agent/ folder.
          # This violates eslint-plugin-project-structure rules in the pre-commit hook.
          # We remove it here until the CLI is fixed.
          rm -rf agent/

      - name: 🔍 Detect Upgrades
        id: check
        run: |
          if git diff --quiet; then
            echo "has_dependency_updates=false" >> $GITHUB_OUTPUT
          else
            echo "has_dependency_updates=true" >> $GITHUB_OUTPUT
          fi

      - name: 🔐 Import GPG Key
        id: import-gpg
        if: steps.check.outputs.has_dependency_updates == 'true'
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: 🔀 Open Pull Request
        if: steps.check.outputs.has_dependency_updates == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer: >-
            ${{ steps.import-gpg.outputs.name }}
            <${{ steps.import-gpg.outputs.email }}>
          author: >-
            ${{ steps.import-gpg.outputs.name }}
            <${{ steps.import-gpg.outputs.email }}>
          sign-commits: true
          commit-message: "chore(dependencies): ⬆️ Upgrade"
          branch: chore/dependencies-upgrade
          delete-branch: true
          title: "chore(dependencies): ⬆️ Upgrade"
          body: |
            ## 🌰 Summary

            Automated toolchain updates detected by the weekly dependency check.
            Per-package npm and GitHub Actions bumps arrive separately, as their
            own Dependabot pull requests.

            ## 📝 Details

            - Update node to latest patch of current major
            - Update pnpm to latest version
            - Deduplicate the lockfile so in-range transitive upgrades land
            - Update pnpm lockfile
            - Update Python to latest stable 3.x
            - Update Python dependencies across all projects
            - Update vendored skills from their upstream sources

            ## 🧪 Testing

            1. Review changes in the diff
            2. Verify all code checks pass
            3. Test functionality manually (if needed)

            ## 🔗 Related

            - *Generated by [🧑‍🚒 Upgrade Dependencies](${{
              format(
                'https://github.com/{0}/actions/workflows/{1}',
                github.repository,
                'upgrade-dependencies.yml'
              )
            }})*
          # The type:, scope:, and source: labels and the assignee are what
          # 🧑‍⚖️ Validate Conventions requires of every pull request, this
          # one included. The type and scope mirror the title above.
          labels: |
            dependencies
            automated
            type:chore
            scope:dependencies
            source:agent
          assignees: JimmyPaolini
