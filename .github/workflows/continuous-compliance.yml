name: 🦹 Continuous Compliance

# External and repository compliance checks:
# 1. 🧑‍💼 Issue: Issue metadata, hierarchy, and release significance.
# 2. 👮 Enforce: Repository governance and workflow security.
# 3. 🧑‍⚖️ Comply: Pull request metadata and commit message conventions, on
#    pull requests and again on the merge queue group that will land them.
#
# Label reconciliation runs through `tools/synchronization`, and compliance
# validation runs through `tools/validation`. All checks execute directly via
# Node.js without building an Nx project graph.

on:
  push:
    branches:
      - main
  issues:
    types: [opened, reopened, unassigned, edited, labeled, unlabeled]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - labeled
      - unlabeled
      - assigned
      - unassigned
      - ready_for_review
  # The merge queue waits for every required check on the group's commit, and
  # 🧑‍⚖️ Comply is one of them.
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: 18 12 * * 5 # Weekly Friday 8:18am NYC (EDT: 12:18 UTC / EST: 13:18 UTC)
  workflow_dispatch:

permissions:
  contents: read
  # Label creation and updates are issues-scoped and pull-requests-scoped
  # endpoints, which is what the label reconciliation steps below write through.
  issues: write
  pull-requests: write

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request'
    && github.head_ref || (github.ref == 'refs/heads/main' && github.sha || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  issue:
    name: 🧑‍💼 Issue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'issues' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch')

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: 🟢 Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The label reconciliation steps and audit checks run their CLIs
      # directly through node rather than through Nx, so those projects
      # and the workspace packages they import are all this needs. The trailing
      # `...` on each filter resolves that transitively. Still no Nx cache, no
      # uv, and no Homebrew: there is no project graph to build.
      - name: 📚 Install Root Dependencies
        run: |
          CI=true pnpm install --frozen-lockfile --reporter=append-only \
            --filter . --filter synchronization... --filter validation... \
            --ignore-scripts

      # Only on the event that creates an issue — an edit or a label change
      # never adds a field the body didn't already have, and re-adding labels
      # on every edit would fight a human who removed one on purpose.
      - name: 🏷️ Reconcile Issue Labels
        if: github.event_name == 'issues' && github.event.action == 'opened'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS: ${{ toJSON(github.event.issue.labels) }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            tools/synchronization/src/main.ts issue-labels

      # Issue events can arrive with no assignees. Default those to the
      # repository owner while leaving already-owned issues unchanged.
      - name: 🧑‍💼 Ensure Issue Assignee
        if: >-
          github.event_name == 'issues' &&
          github.event.issue != null &&
          github.event.issue.assignees[0] == null
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --add-assignee JimmyPaolini

      # On scheduled or manual runs, sweep all open issues and assign any
      # that are currently unassigned.
      - name: 🧑‍💼 Ensure Open Issues Have Assignees
        if: github.event.issue == null
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS= read -r issue_number; do
            if [ -n "$issue_number" ]; then
              gh issue edit "$issue_number" --add-assignee JimmyPaolini
            fi
          done < <(gh issue list --state open --limit 500 --search "no:assignee" --json number \
            --jq '.[].number')

      # Read live, by issue number, rather than out of this event's payload.
      - name: 🧾 Audit Single Issue Metadata
        if: github.event_name == 'issues' && github.event.issue != null
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            tools/validation/src/main.ts issue-metadata "$ISSUE_NUMBER"

      # Sweeps and audits all open issues and hierarchy relationships on
      # scheduled runs and manual dispatches.
      - name: 🧾 Audit All Open Issues Metadata
        if: github.event.issue == null
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            tools/validation/src/main.ts issue-metadata --all

  enforce:
    name: 👮 Enforce
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch')

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: 🟢 Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 📚 Install Root Dependencies
        run: |
          CI=true pnpm install --frozen-lockfile --reporter=append-only \
            --filter . --filter synchronization... --filter validation... \
            --ignore-scripts

      # Audits repository governance (CODEOWNERS rules and workflow security).
      - name: 👮 Audit Repository Governance
        run: |
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            tools/validation/src/main.ts audit-governance

  comply:
    name: 🧑‍⚖️ Comply
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Runs on Dependabot's pull requests too, so a title, label, or release
    # significance failure shows on the pull request rather than first in the
    # merge queue. Only the body check below exempts them.
    if: >-
      (github.event_name == 'push' ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && !github.event.pull_request.draft))

    steps:
      # A merge group carries no pull request payload, only its temporary
      # `gh-readonly-queue/<base>/pr-<number>-<sha>` ref. Every pull request
      # check below reads the queued pull request live through this number, so
      # an edit made after the pull request entered the queue is caught here.
      # The author is read too, since `github.actor` here is whoever queued the
      # pull request, never the bot that opened it.
      - name: 🚂 Resolve Merge Group Pull Request
        id: merge-group
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          PULL_REQUEST_NUMBER="$(sed -nE 's#^.*/pr-([0-9]+)-[0-9a-f]+$#\1#p' <<< "$HEAD_REF")"
          if [ -z "$PULL_REQUEST_NUMBER" ]; then
            echo "::error::Unable to parse a pull request number from ${HEAD_REF}"
            exit 1
          fi
          PULL_REQUEST_AUTHOR="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}" \
            --jq .user.login)"
          echo "🚂 Merge group ${HEAD_REF} queues pull request #${PULL_REQUEST_NUMBER} by ${PULL_REQUEST_AUTHOR}."
          echo "pull-request-number=${PULL_REQUEST_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "pull-request-author=${PULL_REQUEST_AUTHOR}" >> "$GITHUB_OUTPUT"

      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: 🟢 Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 📚 Install Root Dependencies
        run: |
          CI=true pnpm install --frozen-lockfile --reporter=append-only \
            --filter . --filter synchronization... --filter validation... \
            --ignore-scripts

      # Only on pull request events — syncs labels from PR title. A merge group
      # check must not write to the pull request it is judging.
      - name: 🏷️ Reconcile Pull Request Labels
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            tools/synchronization/src/main.ts pull-request-labels write

      # Validates that the pull request branch name conforms to Conventional
      # Commits. A merge group's branch is the queue's own, so it is not checked.
      - name: 🌿 Validate Branch Name
        if: github.event_name == 'pull_request'
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          npx validate-branch-name -t "$BRANCH_NAME"

      # Validates that the pull request title follows Conventional Commits
      # format. A merge group reads the title live, since the squash commit's
      # subject is that title and it may have been edited after queueing.
      - name: 🏷️ Validate Pull Request Title
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: >-
            ${{ github.event.pull_request.number || steps.merge-group.outputs.pull-request-number }}
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "merge_group" ]; then
            PULL_REQUEST_TITLE="$(gh pr view "$PULL_REQUEST_NUMBER" --json title -q .title)"
          fi
          echo "$PULL_REQUEST_TITLE" | \
            npx commitlint --config configuration/commitlint.config.ts

      # Validates pull request body against required template sections. Skipped
      # for a pull request Dependabot authored, whose body it writes itself;
      # keyed off the author, not `github.actor`, which is whoever last labeled,
      # edited, or queued it.
      - name: 📝 Validate Pull Request Body
        if: >-
          (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
          (github.event.pull_request.user.login ||
          steps.merge-group.outputs.pull-request-author) != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: >-
            ${{ github.event.pull_request.number || steps.merge-group.outputs.pull-request-number }}
        run: |
          gh pr view "$PULL_REQUEST_NUMBER" --json body -q .body > pull_request_body.md
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            tools/validation/src/main.ts pull-request-body pull_request_body.md
          rm pull_request_body.md

      # Validates that PR title release significance matches or exceeds commits.
      - name: 🚦 Validate Release Significance
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: >-
            ${{ github.event.pull_request.number || steps.merge-group.outputs.pull-request-number }}
        run: |
          NODE_OPTIONS='' node --import @swc-node/register/esm-register \
            tools/validation/src/main.ts pull-request-release-significance \
            "$PULL_REQUEST_NUMBER"

      # Validates that the latest commit on main follows Conventional Commits.
      - name: 🏷️ Validate Commit Message
        if: github.event_name == 'push'
        run: |
          git log -1 --pretty=%s | \
            npx commitlint --config configuration/commitlint.config.ts

      # Validates the merge group's head commit, which is exactly what lands on
      # main. GitHub does not document the subject a queued squash commit
      # carries, so a generic "Merge pull request #…" subject is logged and
      # passed; the live title check above is the guard in that case.
      - name: 🏷️ Validate Merge Group Commit Message
        if: github.event_name == 'merge_group'
        env:
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          COMMIT_SUBJECT="$(git log -1 --pretty=%s "$HEAD_SHA")"
          if [[ "$COMMIT_SUBJECT" == "Merge pull request #"* ]]; then
            echo "⏭️ Generic queue subject, not linted: ${COMMIT_SUBJECT}"
            exit 0
          fi
          echo "🏷️ Linting merge group commit subject: ${COMMIT_SUBJECT}"
          echo "$COMMIT_SUBJECT" | \
            npx commitlint --config configuration/commitlint.config.ts
