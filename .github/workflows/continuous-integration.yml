name: 🧑‍🎤 Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  merge_group:
  workflow_dispatch:
    inputs:
      verbose:
        description: Enable verbose Nx logging
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref == 'refs/heads/main'
    && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  continuous-integration:
    name: ${{ matrix.check.emoji }} ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        check:
          - target: typecheck-code
            name: Typecheck
            emoji: 🧑‍🎓
          - target: format-code
            name: Format
            emoji: 🧑‍🎨
          - target: lint-code
            name: Lint
            emoji: 🧑‍🔧
          - target: deprecate-code
            name: Deprecate
            emoji: 🧟
          - target: guard-code
            name: Guard
            emoji: 💂
          # Tests run in three legs that together cover every project once.
          # Meanderaw alone: uncached, it took over seven minutes beside every
          # other project's tests and waited for a free `--parallel` slot, so a
          # run that affects everything (an `nx.json` change) outlasted the
          # 12-minute limit; alone it takes about three. ic-suite's 36 packages
          # were most of what remained. The third leg, everything else, keeps
          # the `Test` name branch protection has always required. A leg whose
          # projects are unaffected runs nothing.
          - target: test-code
            name: Test
            emoji: 🧑‍🔬
            exclude: meanderaw-cli,packages/ic-suite/**
          - target: test-code
            name: Test Meanderaw
            emoji: 🧑‍🔬
            exclude: "*,!meanderaw-cli"
            shard: meanderaw-cli
          - target: test-code
            name: Test IC Suite
            emoji: 🧑‍🔬
            exclude: "*,!packages/ic-suite/**"
            shard: ic-suite
          - target: secure-code
            name: Secure
            emoji: 🕵️
          - target: build-projects
            name: Build
            emoji: 👷

    steps:
      - name: 🚦 Skip Conditionally
        id: check-skip
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RUNS_ENDPOINT="repos/${{ github.repository }}/actions"
            RUNS_ENDPOINT="${RUNS_ENDPOINT}/workflows/continuous-integration.yml"
            LATEST_RUN_ID="$(gh api \
              "${RUNS_ENDPOINT}/runs?event=pull_request&branch=${HEAD_BRANCH}&per_page=1" \
              --jq '.workflow_runs[0].id')"
            if [ -n "$LATEST_RUN_ID" ] && [ "$LATEST_RUN_ID" != "${{ github.run_id }}" ]; then
              echo "⏭️ Run ${LATEST_RUN_ID} is newer for this pull request."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: 📥 Checkout Repository
        if: steps.check-skip.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🕋 Setup Codebase
        id: setup
        if: steps.check-skip.outputs.skip != 'true'
        uses: ./.github/actions/setup-codebase
        with:
          gitleaks: ${{ matrix.check.target == 'secure-code' && 'true' || 'false' }}
          trivy: ${{ matrix.check.target == 'secure-code' && 'true' || 'false' }}
          python-dependencies: >-
            ${{ matrix.check.target != 'build-projects' && 'true' || 'false' }}
          uv: "true"
          nx-cache: "true"
          nx-cache-scope: >-
            ${{ github.job }}-${{ matrix.check.target }}${{ matrix.check.shard
            && format('-{0}', matrix.check.shard) || '' }}
          nx-graph-cache: "true"
          nx-shas: "true"
          nx-base: push-before
          eslint-cache: ${{ matrix.check.target == 'lint-code' && 'true' || 'false' }}

      - name: ${{ matrix.check.emoji }} ${{ matrix.check.name }}
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.check.target == 'secure-code'
        env:
          NX_VERBOSE_LOGGING: ${{ inputs.verbose || false }}
        run: pnpm exec nx run codebase:secure-code-ci

      - name: ${{ matrix.check.emoji }} ${{ matrix.check.name }}
        id: run-check
        if: >-
          steps.check-skip.outputs.skip != 'true' &&
          matrix.check.target != 'secure-code'
        continue-on-error: ${{ matrix.check.target == 'build-projects' }}
        env:
          NX_VERBOSE_LOGGING: ${{ inputs.verbose || false }}
        uses: ./.github/actions/run-affected
        with:
          target: ${{ matrix.check.target }}
          include-spelling: ${{ matrix.check.target == 'format-code' }}
          arguments: >-
            ${{ matrix.check.target == 'test-code' && '--configuration=coverage'
            || matrix.check.target != 'build-projects' && '--configuration=check'
            || '' }} --parallel=4 ${{ matrix.check.exclude
            && format('--exclude={0}', matrix.check.exclude) || '' }}

      - name: 📊 Report Integration
        if: >-
          always() &&
          steps.check-skip.outputs.skip != 'true' &&
          (matrix.check.target == 'build-projects' ||
          matrix.check.target == 'typecheck-code' ||
          matrix.check.target == 'test-code')
        uses: ./.github/actions/report-integration
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          is-main-branch: ${{ github.ref == 'refs/heads/main' }}
          is-pull-request: ${{ github.event_name == 'pull_request' }}
          run-outcome: ${{ steps.run-check.outcome }}
          pull-request-number: ${{ github.event.pull_request.number }}
          target: ${{ matrix.check.target }}
          shard: ${{ matrix.check.shard }}

      - name: 🧹 Cleanup Codebase
        if: always() && steps.check-skip.outputs.skip != 'true'
        uses: ./.github/actions/cleanup-codebase
        with:
          nx-cache: "true"
          nx-cache-primary-key: ${{ steps.setup.outputs.nx-cache-primary-key }}
          eslint-cache: ${{ matrix.check.target == 'lint-code' && 'true' || 'false' }}
