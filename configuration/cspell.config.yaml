version: "0.2"
language: en
useGitignore: true
$schema: https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json
ignorePaths:
  - ./.devcontainer/devcontainer.json
  - .git
  - .conformetry
  - .nx
  - "*.eot"
  - "*.gif"
  - "*.ico"
  - "*.jpeg"
  - "*.jpg"
  - "*.lock"
  - "*.png"
  - "*.svg"
  - "*.ttf"
  - "*.woff"
  - "*.woff2"
  - "**/.terraform/**"
  # Nested agent worktrees are not listed: an ignore path matches absolute
  # paths, so `**/.claude/worktrees/**` ignores every file of a checkout that
  # is itself a worktree, and no target here walks into `.claude/` anyway.
  - "**/*.gen.ts"
  - "**/*.min.css"
  - "**/*.min.js"
  - "**/Modelfile*"
  - "**/CHANGELOG.md"
  - "**/coverage"
  - "**/dist"
  - "**/supabase/data.sql"
  - "**/applications/lexico/lexico-cli/data/**"
  - "**/applications/lexico/lexico-cli/src/modules/literature/literature.constants.ts"
  - "**/applications/lexico/lexico-cli/src/modules/library/library.constants.ts"
  - "**/documentation/planning/**"
  # 🌀 Every meander the `draw` command writes. The SVGs are already covered by
  # the `*.svg` entry above; the index page listing them is markup, and its link
  # text is three thousand mosaic tile identifiers — `ddddd-dots` and its
  # siblings — which are coordinates in a parameter space rather than words.
  # `.codometerignore` and `.prettierignore` exclude the same directory.
  - "**/applications/meanderaw/meanderaw-cli/output/**"
  # cspell:ignore mermiad
  # 🔭 Everything callidescope's examples run writes. The report carries each
  # traced callable's own JSDoc summary verbatim, so a word a source file
  # deliberately misspells — `mermiad`, the typo'd `--format` value the flag
  # refusal is written around — arrives here stripped of the `cspell:ignore`
  # comment that exempts it at the source, and JSON has nowhere to put one
  # back. Spelling is checked where the prose is authored; this is a copy.
  - "**/packages/ic-suite/callidescope/callidescope-examples/output/**"
  # 🧩 Installed agent skills, one entry per skill in skills-lock.json. Owned
  # upstream rather than authored here, so their prose stays spelled the way
  # their sources spelled it. Listed individually rather than as
  # `.agents/skills/` so this repository's own skills in the same directory keep
  # being checked. Verified by `nx run synchronization:skill-exclusions`, which
  # also generates the block below.
  - "**/.agents/licenses/**"
  # installed-skills-start
  - "**/.agents/skills/ask-matt/**"
  - "**/.agents/skills/brainstorming/**"
  - "**/.agents/skills/callidescope-configure/**"
