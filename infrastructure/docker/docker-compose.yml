name: codebase
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - 3001:8080
    volumes:
      - open-webui_data:/app/backend/data
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      ENABLE_WEBSOCKET_SUPPORT: "false"
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8080/health]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    container_name: postgres
    env_file: ../../.env
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    configs:
      - source: postgres-databases
        target: /docker-entrypoint-initdb.d/databases.sql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - 8889:8080
    volumes:
      - ../../applications/affirmancy/searxng.settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://localhost:8889
    healthcheck:
      test: [CMD, wget, -qO-, http://localhost:8080/]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

configs:
  # Inline rather than a bind-mounted file, so the shared container never
  # depends on the checkout or worktree that last recreated it. Runs only
  # when the volume is empty: `nx run codebase:postgres-container:recreate`.
  postgres-databases:
    content: |
      CREATE DATABASE meanderaw_development;
      \connect meanderaw_development
      CREATE SCHEMA meanderaw_development;

volumes:
  open-webui_data:
  postgres_data:
