name: codebase
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - 3001:8080
    volumes:
      - open-webui_data:/app/backend/data
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      ENABLE_WEBSOCKET_SUPPORT: "false"
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8080/health]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    container_name: postgres
    env_file: ../../.env
    environment:
      # Every database-backed project: adding one is adding its name here.
      POSTGRES_PROJECTS: caelundas lexico meanderaw
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    configs:
      - source: postgres-databases
        target: /docker-entrypoint-initdb.d/databases.sh
        # Executable, so the image runs it in its own shell rather than
        # sourcing it: its `set -eu` and `exit` stay out of the entrypoint.
        mode: "0555"
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - 8889:8080
    volumes:
      - ../../applications/affirmancy/searxng.settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://localhost:8889
    healthcheck:
      test: [CMD, wget, -qO-, http://localhost:8080/]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

configs:
  # Inline rather than a bind-mounted file, so the shared container never
  # depends on the checkout or worktree that last recreated it. Runs only
  # when the volume is empty: `nx run codebase:postgres-container:recreate`.
  # For an existing volume, run it by hand for the new project instead:
  # `docker exec -e POSTGRES_PROJECTS=<project> postgres sh
  # /docker-entrypoint-initdb.d/databases.sh`, as the seed-postgres skill
  # and docs/adr/0022-give-every-database-project-its-own-database-schema-and-role.md
  # describe.
  #
  # For each project in `POSTGRES_PROJECTS`: a `<project>_username` role, a
  # `<project>_development` database it owns, and, inside that database, a
  # `<project>` schema it owns. The unprefixed `POSTGRES_*` in the root
  # `.env` remain the container's admin login, which runs this script. `$$`
  # escapes Compose's own interpolation, leaving `$` for the shell.
  postgres-databases:
    content: |
      #!/bin/sh
      set -eu

      for project in $$POSTGRES_PROJECTS; do
        case "$$project" in
          '' | [!a-z]* | *[!a-z0-9_]*) echo "bad project: $$project" >&2; exit 1 ;;
        esac
        psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" <<SQL
      CREATE ROLE $${project}_username LOGIN PASSWORD '$${project}_password';
      CREATE DATABASE $${project}_development OWNER $${project}_username;
      \connect $${project}_development
      CREATE SCHEMA $${project} AUTHORIZATION $${project}_username;
      SQL
      done

volumes:
  open-webui_data:
  postgres_data:
